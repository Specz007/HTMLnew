<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <table border="3" cellpadding="20" cellspacing="10" bordercolor="black">

        <!-- Cellpadding increases the space between the texts -->
         <!-- Cellspacing is the space between two cells in the table -->

        <thead>
            <tr>
                <th>Name</th>
                <th>RegNo.</th>
                <th>Marks</th>
            </tr>
        </thead>

        <tbody>

            <tr>
                <td>Raj</td>
                <td>123</td>
                <td>50</td>
            </tr>

            <tr>
                <td>Harsh</td>
                <td>348</td>
                <td>90</td>
            </tr>

        </tbody>

        <tfoot>

            <tr>
                <th rowspan="3">Average</th>

                <!-- The colspan in the th makes the Average use 2 coloumns 
                 In short it combines the coloumns -->

                 <!-- rowspan is also there but it combines the rows together -->

                <td>85</td>
            </tr>

        </tfoot>

    </table>
    
</body>
</html>
