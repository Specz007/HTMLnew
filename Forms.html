<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   
    <form action="" method="post">

        <fieldset>

            <legend><b>REGISTRATION FORM</b></legend>

        <label for="f1">First Name</label>
        <input type="text" id="f1" value="" name="firstname" maxlength="8" placeholder="Enter the first name"
         required>

         <!--maxlength is for limitation of max characters or letters  -->
        <!-- for connecting the labe and the input we should put id in the input -->
         <!-- On the backend the value passed 'Raj' will be equalled to name attribute -->
          <!-- placeholder is for hinting the user about what to write -->
           <!-- The required attribute is used to make sure the user to type the things compulsoryly -->
            <!-- The autofocus is used to make the curson on the box by default -->
             <!-- readonly attribute and disabled attribute in input tag -->

         <br><br>

         <!-- the br is added for space in between  -->

         <label for="l1">Last Name</label>
         <input type="text" id="l1" maxlength="8" placeholder="Enter the last name">


         <br><br>


         <label for="pswd">Password</label>
         <input type="password" id="pswd" maxlength="16" placeholder="Enter the password">


         <br><br>


         <label for="e1">Email</label>
         <input type="email" id="e1" placeholder="Enter the email">


         <br><br>


         <label for="review">Enter review</label><br>
         <!-- if no br here then the "Enter the review" will be below  -->
         <textarea name="review" id="review" rows="10" cols="50"></textarea>
         <!-- rols increase the rows and cols increase the columns -->
</fieldset>
<!-- The fieldset gives a border around all the code -->
         <br><br>

         <!-- This is for sports -->

         <label for="">Select Sports</label>

         <br>

         <input type="checkbox" name="sports" id="volley" value="Vollyball">
         <label for="volley">Vollyball</label>

         <input type="checkbox" name="sports" id="cricket" value="cricket">
         <label for="cricket">Cricket</label>
         
         <input type="checkbox" name="sports" id="football" value="Football" checked>
         <label for="football">Football</label>
         <!-- For an option to be marked by default we should add the attribute checked for type=checkbox -->

         <br><br>

         <input type="submit" name="submit" id="submit">

         <br><br>

         <label for="">Choose course</label>

         <br>

         <input type="radio" name="course" id="bt" value="" checked>
         <label for="bt">B-Tech</label>
         <!-- For radio type also the by default option selection is, checked attribute too :) -->

         <input type="radio" name="course" id="ba" value="">
         <label for="ba">BCA</label>

         <input type="radio" name="course" id="bsc" value="">
         <label for="bsc">BSc</label>

         <!-- In here only one option can be selected unlike the checkbox
          only if we add name attrib to it, and also the name should also be the same-->
          <!-- The name is the attribute to group the things together -->

          <br><br>

          <!-- next we are going to create a drop down options but only will be able to select one at a time -->

          <label for="">Choose State</label>

          <select name="state" id="state">
            <!-- The size and multiple attribute is used to change the size of the box and for the
             multiple selection of the options respectively -->

             <!-- size="2" multiple in select tag -->

            <option value="punjab">Pubjab</option>
            <option value="kerala" selected>Kerala</option>
            <!-- The selected attribute is used to make the option by defaultly selected to the top option -->
            <option value="tn">Tamilnadu</option>

            <input type="submit" name="submit" id="submit">

          </select>

          <br><br>

          <label for="upload">Choose File</label>
          <input type="file" id="upload" name="upload">

          <br><br>

          <label for="marks">Enter Marks</label>
          <input type="number" id="makrs" name="marks" min="3" max="30" step="8">

          <br>

          <input type="submit" name="submit" name="submit">

          <br><br>

          <label for="date">Enter the date</label>
          <input type="date" id="date" name="date">

          <br>

          <input type="submit" id="submit" name="submit">

          <br><br>

          <label for="time">Enter the time</label>
          <input type="time" name="time" id="time">

          <br><br>

          <input type="range" max="100" value="20">
          <!-- Range attribute give the slider for adjusting ex- volume -->

          <br><br>

          <progress max="100" ></progress>
          <!-- IDk what this does better look in yt -->

          <br><br>









          <input type="reset" id="reset" name="reset" >
          <!-- Resets all the values passed to the text -->

          <br><br>

          <input type="button" value="OK">
    </form>

</body>
</html>
