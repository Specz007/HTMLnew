<html lang="en">

<body>
    <h1>Audio tags</h1>

    <audio controls autoplay muted loop>
        <source src="/Audios/audio outro.mp3" type="audio/mp3">
    </audio>

    <video controls width="300" height="300">
        <source src="/videos/Nature.mp4" type=" video/mp4">
    </video>

    <svg width="300" height="300">
        <rect width="50" height="40" fill="blue"></rect>
        <circle cx="150" cy="100" r="30" fill="yellow"></circle>
        <ellipse cx="50" cy="200" rx="30" ry="20" fill="red"></ellipse>
        <line x1="50" y1="60" x2="50" y2="100" stroke="black" stroke-width="1" ></line>
        <!-- we dont use width and height seperately it in on stroke-width  -->
        <polygon points="20,40,40,10,60,30"></polygon>
    </svg>

    <br>
    <iframe src="https://www.youtube.com/embed/ebZj_nrmH-c?si=xguMr104_x_Ywqf9" title="YouTube video player" 
    frameborder="0" width="500" height="300" ></iframe>

    <!-- Tags that we need to do before next class iframes, video -->
     <!-- In iframes only the urls which allow ifram emebedding is possible to be put inside -->
      <!-- This is youtube link is embedded link -->
